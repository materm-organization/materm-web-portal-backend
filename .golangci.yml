version: "2"

linters:
  default: none
  enable:
    # --- Bug prevention ---
    - errcheck        # unchecked errors
    - govet           # suspicious constructs (printf format, shadowing, etc.)
    - staticcheck     # comprehensive static analysis
    - nilerr          # return nil after checking err != nil
    - bodyclose       # HTTP response body not closed

    # --- Code quality ---
    - ineffassign     # variable assigned but never used
    - unused          # unused code / unexported identifiers

    # --- Context correctness ---
    - contextcheck    # ensure context is propagated

    # --- Security / database hygiene ---
    - gosec           # security issues (SQL built by string concatenation, weak crypto, int overflow, ...)
    - rowserrcheck    # sql.Rows.Err() must be checked
    - sqlclosecheck   # sql.Rows / Stmt must be closed

  settings:
    govet:
      enable-all: true
      disable:
        - fieldalignment  # struct padding — too noisy for domain types
    staticcheck:
      checks:
        - all
        - -ST1000
        - -ST1003
        - -ST1020
        - -ST1021
        - -ST1022

  exclusions:
    # std-error-handling suppresses defer Body.Close() and other idiomatic patterns
    presets:
      - std-error-handling

    rules:
      # Test files — relax errcheck, contextcheck and bodyclose (app.Test responses are in-memory) and gosec
      # (tests use throw-away passwords and talk to the scratch database only)
      - path: _test\.go
        linters:
          - errcheck
          - contextcheck
          - bodyclose
          - gosec

      # LEGACY helpers kept as they are: the HTTP client takes its base URL from configuration (not from user
      # input) and convertor ignores copier errors on purpose (see the copier.Copy rule below).
      - path: pkg/httpclient/
        linters:
          - gosec
      - path: pkg/utilities/convertor/
        linters:
          - gosec

      # error code names such as INVALID_TOKEN / TOKEN_EXPIRED trip the "hardcoded credentials" heuristic
      - path: pkg/apperror/
        linters:
          - gosec
        text: G101

      # Generated swagger docs
      - path: docs/
        linters:
          - all

      # copier.Copy only fails on programmer-error type mismatches, not at runtime
      - path: (.+)\.go$
        linters: [errcheck]
        text: 'Error return value of `copier\.Copy` is not checked'

issues:
  max-issues-per-linter: 50
  max-same-issues: 5
